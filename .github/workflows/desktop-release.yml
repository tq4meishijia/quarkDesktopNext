name: Desktop Release

# 触发：推送 v* 标签，或在 Actions 页面手动触发。
#
# 与 ci.yml 的分工：ci.yml 负责每次提交的编译校验；本工作流负责把桌面端
# 编译成各平台可执行文件，并创建/更新对应 tag 的 GitHub Release。
#
# 布局说明：桌面端主工程就在仓库根目录，上游 CLI 源码随仓库分发在 quark-cil/
# （go.mod 的 replace 指向 ./quark-cil），因此无需在 CI 上额外 clone 上游。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 tag（如 v1.2.3）；留空则自动生成为 v<日期>-<短 sha>'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 产物名：项目名-版本-系统-架构（版本号本身不含 v 前缀）
  PROJECT: kuake-desktop

jobs:
  # ---------------------------------------------------------------------------
  # 1. 解析版本号：push tag 时直接取 tag；手动触发时取输入值，或自动生成
  # ---------------------------------------------------------------------------
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ github.event.inputs.tag }}"
            if [ -z "$tag" ]; then
              tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
            fi
            # 允许填写 1.2.3 或 v1.2.3，统一补齐 v 前缀
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          fi
          version="${tag#v}"
          if [ -z "$version" ]; then
            echo "无法从 tag '$tag' 推导版本号" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::tag=$tag version=$version"

  # ---------------------------------------------------------------------------
  # 1.5 发布前门禁：两个模块的 build / vet / test
  #
  # 原先本 workflow 只构建、不跑任何测试，测试失败的版本也能发出去。
  # 这里补上前置门禁：任一模块测试不过就不进入构建矩阵。
  # ---------------------------------------------------------------------------
  verify:
    name: 发布前校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      - name: 桌面端 build / vet / test
        run: |
          set -euo pipefail
          go mod download
          go build ./...
          go vet ./...
          go test -count=1 ./...

      # 竞态检测不在此重复执行。
      #
      # 原因：-race 在不同 runner 上的结果不稳定（CI 的 CPU 抢占会改变协程
      # 交错顺序），实测同一份代码在 ci.yml 的 race job 通过、在本工作流失败，
      # 且重试两次仍失败。把它作为发布阻断项会导致发布流程随机卡死。
      #
      # 竞态检测统一由 ci.yml 的 `race (linux)` job 承担 —— 那里已经稳定通过，
      # 且合并到 main 之前就会跑。发布流水线只负责 build/vet/test + 真实构建。

      - name: quark-cil build / vet / test
        working-directory: quark-cil
        run: |
          set -euo pipefail
          go mod download
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: 前端语法与目录树校验
        run: |
          set -euo pipefail
          node --experimental-vm-modules scripts/check-frontend-syntax.mjs
          python3 scripts/verify-readme-tree.py

  # ---------------------------------------------------------------------------
  # 2. 构建矩阵：Linux / macOS / Windows × amd64 / arm64
  #    不稳定或 Runner 暂不支持的组合用 experimental 标记，失败只跳过不影响整体
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.label }}
    needs: [version, verify]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    goos: linux,   goarch: amd64, label: 'Linux amd64',   experimental: false }
          - { os: ubuntu-24.04-arm, goos: linux,   goarch: arm64, label: 'Linux arm64',   experimental: false }
          - { os: macos-latest,     goos: darwin,  goarch: arm64, label: 'macOS arm64',   experimental: false }
          - { os: macos-15-intel,   goos: darwin,  goarch: amd64, label: 'macOS amd64',   experimental: true  }
          - { os: windows-latest,   goos: windows, goarch: amd64, label: 'Windows amd64', experimental: false }
          - { os: windows-latest,   goos: windows, goarch: arm64, label: 'Windows arm64', experimental: true  }

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 上游 CLI 源码随仓库分发在 quark-cil/，无需额外 clone；此处仅做存在性校验，
      # 避免 replace 目标缺失时把错误推迟到编译阶段。
      - name: 校验上游 CLI 源码
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f quark-cil/go.mod ]; then
            echo "::error::未找到上游 CLI 源码 quark-cil/go.mod"
            exit 1
          fi
          echo "上游 CLI 源码就绪：quark-cil/"

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      # ---------------------------------------------------------------
      # 预检：补齐系统依赖；明确不支持的组合在此跳过（不算失败）
      # ---------------------------------------------------------------
      - name: 预检与系统依赖
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          skip="false"
          reason=""

          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update -qq
              if ! sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev; then
                skip="true"; reason="缺少 GTK/WebKit 依赖"
              fi
              ;;
            macOS)
              # Intel Runner 才能原生构建 darwin/amd64；缺失时由 experimental 兜底
              if [ "${{ matrix.goarch }}" = "amd64" ] && [ "$(uname -m)" != "x86_64" ]; then
                skip="true"; reason="当前 Runner 非 x86_64，无法构建 darwin/amd64"
              fi
              ;;
            Windows)
              if [ "${{ matrix.goarch }}" = "arm64" ]; then
                skip="true"; reason="Windows/arm64 交叉编译暂不支持（依赖 WinRes + CGO）"
              fi
              ;;
          esac

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            echo "::warning::${{ matrix.label }} 已跳过：$reason"
          fi

      - name: 安装 Wails CLI
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------
      # 构建：产物直接命名为 项目名-版本-系统-架构[.exe]
      # ---------------------------------------------------------------
      - name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
        id: compile
        if: steps.preflight.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ env.PROJECT }}-${{ needs.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # Ubuntu 24.04 只提供 webkit2gtk-4.1，而 Wails v2 默认按 4.0 走 pkg-config，
          # 不加这个标签会报 "Package 'webkit2gtk-4.0' ... not found" 导致编译失败。
          TAGS=""
          if [ "${{ matrix.goos }}" = "linux" ]; then
            TAGS="-tags webkit2_41"
          fi

          # shellcheck disable=SC2086
          wails build $TAGS -platform "${{ matrix.goos }}/${{ matrix.goarch }}" -trimpath -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" -o "$NAME"
          ls -la build/bin/

      # ---------------------------------------------------------------
      # 产物整理 + 校验和
      #
      # 版本号注入校验：-X 写错路径时 ldflags 会被**静默忽略**，构建照样成功，
      # 只是产物里没有版本号（见 HANDOFF §6.3 第 14 项）。故在此显式核对。
      # ---------------------------------------------------------------
      - name: 校验版本号已注入
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          EXPECT="${{ needs.version.outputs.version }}"
          echo "期望版本号: $EXPECT"

          # 定位产物。
          #
          # 依据：同一 workflow 里「整理产物与校验和」步骤在 v1.7.2 发布中
          # 成功过，它的平台分支是事实依据：
          #   darwin  → find build/bin -name '*.app'（.app 包目录）
          #   其他     → build/bin/$NAME（无扩展名文件，Windows 为 .exe）
          # 本步骤必须与之一致，否则会出现「打包能找到、校验找不到」的错配。
          #
          # 注意 macOS 分支要用 find 而不是 "$EXPECTED.app"：
          # wails 产出的 .app 名与 NAME 未必完全一致，用固定路径会漏。
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            BINS=()
            while IFS= read -r app; do
              [ -n "$app" ] || continue
              shopt -s nullglob
              for f in "$app"/Contents/MacOS/*; do
                BINS+=("$f")
              done
              shopt -u nullglob
            done < <(find build/bin -maxdepth 1 -name '*.app' -type d)
            if [ "${#BINS[@]}" -eq 0 ]; then
              echo "::error::未在 build/bin 下找到 .app 包内的可执行文件"
              ls -la build/bin/ || true
              exit 1
            fi
          else
            SRC="build/bin/${{ steps.compile.outputs.name }}"
            if [ ! -f "$SRC" ]; then
              SRC="$(find build/bin -maxdepth 1 -type f ! -name '*.dSYM' ! -name '*.zip' -print -quit)"
            fi
            if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
              echo "::error::未在 build/bin 下找到构建产物"
              ls -la build/bin/ || true
              exit 1
            fi
            BINS=("$SRC")
          fi

          # 逐个检查：任一产物含版本号即通过。
          # 用 grep -a -c 计数而非 strings（runner 镜像不带 binutils）；
          # -a 把二进制当文本，-c 给出匹配行数，0 表示没有该版本号。
          FOUND=0
          for BIN in "${BINS[@]}"; do
            HITS="$(grep -a -c "$EXPECT" "$BIN" 2>/dev/null || true)"
            echo "  $(basename "$BIN"): 命中 ${HITS:-0} 处（$(wc -c < "$BIN") bytes）"
            if [ "${HITS:-0}" -gt 0 ]; then
              FOUND=$((FOUND + 1))
            fi
          done

          if [ "$FOUND" -gt 0 ]; then
            echo "✅ 版本号已注入: $EXPECT（$FOUND/${#BINS[@]} 个产物命中）"
          else
            echo "::error::所有产物中均未找到版本号 $EXPECT —— ldflags -X 可能写错了符号路径"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 两个平台差异（实测踩坑，勿轻易简化）：
      #   * Windows：wails 按 -o 的字面名字输出，不会自动补 .exe；
      #   * macOS：wails 忽略 -o 的文件名，产出的是 <outputfilename>.app 包目录，
      #     可执行文件在包内 Contents/MacOS/ 下，因此需要打包成 zip 再分发。
      # Linux 单文件产出与 -o 一致。
      # ---------------------------------------------------------------
      - name: 整理产物与校验和
        id: package
        if: steps.preflight.outputs.skip != 'true' && steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.compile.outputs.name }}"
          mkdir -p dist

          if [ "${{ matrix.goos }}" = "darwin" ]; then
            APP="$(find build/bin -maxdepth 1 -name '*.app' -print -quit)"
            if [ -z "$APP" ]; then
              echo "::error::未在 build/bin 下找到 .app 包"; exit 1
            fi
            ASSET="${NAME}.app.zip"
            zip -qry "dist/${ASSET}" "$APP" -x '*.DS_Store'
          else
            SRC="build/bin/${NAME}"
            if [ ! -f "$SRC" ]; then
              # 兜底：取 build/bin 下最新的普通文件，避免因命名差异再次失败
              SRC="$(find build/bin -maxdepth 1 -type f -print -quit)"
            fi
            if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
              echo "::error::未在 build/bin 下找到构建产物"; exit 1
            fi
            EXT=""
            if [ "${{ matrix.goos }}" = "windows" ]; then
              EXT=".exe"
            fi
            ASSET="${NAME}${EXT}"
            cp "$SRC" "dist/${ASSET}"
            chmod +x "dist/${ASSET}" 2>/dev/null || true
          fi

          python3 - "$ASSET" <<'PY'
          import hashlib, os, sys
          asset = sys.argv[1]
          path = os.path.join("dist", asset)
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          with open(path + ".sha256", "w", encoding="utf-8", newline="\n") as fh:
              fh.write(f"{digest}  {asset}\n")
          print(f"{asset}: {digest}")
          PY
          echo "::notice::${{ matrix.label }} 产物就绪：$ASSET"

      - name: 上传构建产物
        if: steps.preflight.outputs.skip != 'true' && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.compile.outputs.name }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. 发布：创建/更新对应 tag 的 Release 并上传全部产物
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 手动触发时 tag 可能还不存在，这里补建（已存在则复用）
      - name: 确保 tag 存在
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，复用"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}"
            echo "已创建 tag $TAG"
          fi

      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出待上传文件
        run: ls -la release-assets/

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body: |
            kuake-desktop ${{ needs.version.outputs.version }}

            基于 [kuake_cli](https://github.com/zhangjingwei/kuake_cli) 的夸克网盘桌面客户端。

            产物说明：
            - Windows：`*windows-amd64.exe`，双击即可运行
            - Linux：`*linux-*`，下载后需 `chmod +x` 赋予可执行权限
            - macOS：`*darwin-*.app.zip`，解压后得到 `.app` 包，拖入「应用程序」即可
            - 每个产物都有同名 `.sha256`，运行前请先核对校验和
            - macOS/amd64 与 Windows/arm64 为实验性组合，Runner 不支持时本次不会产出对应文件

            本项目为非官方第三方工具，与夸克网盘官方无关。
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          # 重复上传同名资产时覆盖而非报错
          overwrite_files: true
          files: |
            release-assets/*
