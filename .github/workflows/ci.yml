name: CI

on:
  push:
    branches: [main, master, release]
  pull_request:
    branches: [main, master, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # ---------------------------------------------------------------------------
  # 桌面端主工程（仓库根目录模块）
  # ---------------------------------------------------------------------------
  desktop:
    name: desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: gofmt check
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l main.go app internal)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 竞态检测：只在 Linux 上跑（-race 依赖 CGO，Windows/macOS runner 上不可用）
  #
  # 为什么必须有这个 job：transfer 包的信号量、Gate 广播、Task 字段锁
  # 都是手写并发结构，go test 不开 -race 检测不到数据竞争。
  # 上游 loginproxy 曾用「并发压测兜底」代替 race（见其 proxy_test.go 注释），
  # 现在改为在 CI 上直接跑 race detector。
  # ---------------------------------------------------------------------------
  race:
    name: race (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      - name: Download modules
        run: go mod download

      # 竞态检测：-race 依赖 CGO，只能在 Linux 上跑。
      #
      # 加 -v 是为了让失败用例的断言信息出现在日志里（竞态报告很长，
      # 默认输出下看不出是哪个包失败）。
      #
      # 重试说明：并发测试有 flaky 成分（CI runner 的 CPU 抢占会改变协程
      # 交错顺序），同一份代码在不同 runner 上可能一次过一次不过。
      # 连续两次失败才判定为真问题；偶发一次视为调度噪声。
      - name: Race detector (desktop, 最多 2 次尝试)
        run: |
          set -o pipefail
          for i in 1 2; do
            echo "===== race 第 $i 次 ====="
            if go test -race -count=1 -timeout 300s -v ./... 2>&1 | tee "race-desktop-$i.log"; then
              echo "第 $i 次通过"
              exit 0
            fi
            echo "第 $i 次失败"
          done
          echo "==== 两次均失败，汇总诊断 ===="
          grep -hE "^(--- FAIL|FAIL|panic:)" race-desktop-*.log | head -40 || true
          echo "==== 数据竞争详情（前 120 行）===="
          grep -hA 15 "WARNING: DATA RACE" race-desktop-*.log | head -120 || true
          exit 1

      - name: Race detector (quark-cil)
        working-directory: quark-cil
        run: go test -race -count=1 -timeout 300s ./...

  # ---------------------------------------------------------------------------
  # 前端校验：零构建项目同样需要守门
  #
  # 前端是原生 ES Module（无 package.json / 无 bundler），因此不需要
  # npm ci，但语法错误与冒烟回归过去只能靠本地手动跑。
  # 这里把两个既有脚本接进 CI。
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: ESM syntax check
        # vm.SourceTextModule 是实验 API，必须带该标志；
        # 脚本内置可用性探测，缺失时会以退出码 2 明确失败而非假通过。
        run: node --experimental-vm-modules scripts/check-frontend-syntax.mjs

      - name: Verify README tree matches filesystem
        run: python3 scripts/verify-readme-tree.py

      # 运行时冒烟：需要 puppeteer-core + 系统浏览器 + 预览服务三者齐备。
      # 本 job 里三者都不可得（前端是零构建项目，不装 npm 依赖），
      # 故显式跳过。上一版直接跑 node scripts/smoke.mjs 会因缺 puppeteer-core
      # 而 process.exit(1)，把门禁变成永远失败 —— 门禁必须能在无依赖环境下跑通。
      # 本地跑法：先起预览，再 npm i puppeteer-core 并设 NODE_PATH 后执行。
      - name: Runtime smoke test (skipped in CI)
        run: |
          echo "跳过：冒烟测试需 puppeteer-core 与预览服务，属本地工具。"
          echo "本地运行方式见 scripts/README.md"

  # ---------------------------------------------------------------------------
  # 真实构建：go build 不能保证能产出可执行文件
  #
  # go build 不链接 Wails 的 WebView2 / webkit2gtk 平台层，
  # 因此「编译通过」不等于「能构建出桌面程序」。这个 job 跑真正的
  # wails build，并校验产物存在。
  # ---------------------------------------------------------------------------
  desktop-build:
    name: desktop build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Download modules
        run: go build ./...

      # Ubuntu 24.04 只提供 webkit2gtk-4.1，缺这个 tag 会构建失败
      # （见 HANDOFF §7.5 第 33 条）。
      - name: Wails build
        run: wails build -platform linux/amd64 -tags webkit2_41 -clean

      - name: Verify artifact exists
        run: |
          set -e
          if [ ! -f build/bin/kuake-desktop ]; then
            echo "未找到构建产物 build/bin/kuake-desktop"
            ls -la build/bin/ || true
            exit 1
          fi
          ls -la build/bin/

  # ---------------------------------------------------------------------------
  # quark-cil 上游 CLI 模块（随仓库分发的依赖源码，用于保证 replace 目标可用）
  # ---------------------------------------------------------------------------
  quark-cil:
    name: quark-cil / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: quark-cil
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 原先上游 guard 的两个用例硬编码 POSIX 路径，在 Windows 上必然失败，
      # 曾以 go test -skip 规避；现已修复为按 GOOS 选取对应平台的系统路径用例
      # （见 quark-cil/internal/guard），因此不再需要任何 skip。
      - name: Test
        run: go test ./...

  # ---------------------------------------------------------------------------
  # 汇总：便于在分支保护中只配置一个必需检查
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [desktop, quark-cil, race, frontend, desktop-build]
    if: always()
    steps:
      # 注意：GitHub Actions 表达式不支持 needs.<动态变量>.result 这类动态索引
      # （会在解析期报 "Unexpected symbol"），因此这里逐项显式判断。
      - name: Check matrix results
        run: |
          status=0
          echo "desktop=${{ needs.desktop.result }}"
          echo "quark-cil=${{ needs.quark-cil.result }}"
          echo "race=${{ needs.race.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "desktop-build=${{ needs.desktop-build.result }}"
          [ "${{ needs.desktop.result }}" = "success" ] || status=1
          [ "${{ needs.quark-cil.result }}" = "success" ] || status=1
          [ "${{ needs.race.result }}" = "success" ] || status=1
          [ "${{ needs.frontend.result }}" = "success" ] || status=1
          [ "${{ needs.desktop-build.result }}" = "success" ] || status=1
          if [ "$status" -ne 0 ]; then
            echo "存在失败或跳过的检查"
            exit 1
          fi
          echo "全部构建与检查通过"
