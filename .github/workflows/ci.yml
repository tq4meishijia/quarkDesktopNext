name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # ---------------------------------------------------------------------------
  # 桌面端主工程（仓库根目录模块）
  # ---------------------------------------------------------------------------
  desktop:
    name: desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: gofmt check
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l main.go app internal)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # quark-cil 上游 CLI 模块（随仓库分发的依赖源码，用于保证 replace 目标可用）
  # ---------------------------------------------------------------------------
  quark-cil:
    name: quark-cil / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: quark-cil
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            quark-cil/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 说明：internal/guard 的部分用例依赖操作系统权限语义，在以管理员/root
      # 权限执行时会出现与权限相关的既有失败（与本次目录重构无关），
      # 因此在 Windows 运行器上不将其作为阻断项。
      - name: Test
        run: go test ./...
        continue-on-error: ${{ matrix.os == 'windows-latest' }}

  # ---------------------------------------------------------------------------
  # 汇总：便于在分支保护中只配置一个必需检查
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [desktop, quark-cil]
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.desktop.result }}" != "success" ] || \
             [ "${{ needs.quark-cil.result }}" != "success" ]; then
            echo "desktop=${{ needs.desktop.result }}, quark-cil=${{ needs.quark-cil.result }}"
            exit 1
          fi
          echo "全部构建与检查通过"
