<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>夸克网盘桌面版</title>
    <!-- 内联 favicon：避免静态预览/打包后 /favicon.ico 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6cff'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3EQK%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/styles/theme.css" />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/layout.css" />
  </head>
  <body>
    <!-- 应用外壳由 src/main.js 挂载，这里只提供挂载点 -->
    <div id="app" class="app-root" aria-live="polite"></div>
    <!-- 轻提示容器独立于应用树，避免被页面重渲染清掉 -->
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <noscript>本客户端需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
